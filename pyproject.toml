[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dorna_devices"
version = "0.1.0"
description = "Device protocol + MQTT publisher + auto-recovery for the Dorna orchestrator."
authors = [{ name = "Dorna Robotics", email = "support@dorna.ai" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "paho-mqtt>=1.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["dorna_devices*"]
